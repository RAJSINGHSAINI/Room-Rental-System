    <style>
        /* RESET */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: #f1f5f9;
            color: #0f172a;
        }

        /* HERO FIX (NO QUALITY LOSS) */
        .hero {
            position: relative;
            height: 70vh;
            min-height: 400px;
            overflow: hidden;
        }

        .hero-bg {
            position: absolute;
            inset: 0;
        }

        .hero-bg img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            filter: brightness(0.75);
        }

        /* overlay */
        .hero-bg::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, transparent, rgba(0, 0, 0, 0.7));
        }

        .hero-content {
            position: absolute;
            bottom: 40px;
            min-width: 300px;
            left: 60px;
            color: white;
        }

        .hero-content h1 {
            font-size: 42px;
            font-weight: 600;
        }

        .hero-content p {
            opacity: 0.9;
        }

        /* LAYOUT */
        .container {
            max-width: 1300px;
            margin: auto;
            padding: 40px 20px;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 50px;
        }

        /* LEFT */
        .left {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-auto-rows: 160px;
            gap: 12px;
        }

        .gallery img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 14px;
            transition: 0.3s ease;
        }

        .gallery img:first-child {
            grid-column: span 2;
            grid-row: span 2;
            height: 100%;
        }

        .gallery img:hover {
            transform: scale(1.04);
        }

        .details {
            background: white;
            padding: 28px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .meta {
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            gap: 25px;
            margin-top: 15px;
            color: #64748b;
            font-size: 15px;
        }

        .owner-info {
            display: flex;
            flex-direction: column;
        }

        .home-info span {
            margin-right: 10px;
        }

        .right {
            position: relative;
        }

        .booking {
            position: sticky;
            top: 100px;
            padding: 30px;
            border-radius: 18px;
            background: white;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08);
            border: 1px solid #e2e8f0;
        }

        .price {
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: #2c3e50;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.25s ease;
        }

        .btn:hover {
            background: #64748b;
            transform: translateY(-2px);
        }

        @media(max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }

            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }

            .hero-content {
                left: 20px;
            }
        }
    </style>

</head>
